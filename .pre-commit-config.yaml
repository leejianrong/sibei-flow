# =====================================================================
# .pre-commit-config.yaml — sibei-flow local git gates
# Track B: cards #128 (hooks) + #166 (gitleaks, pre-commit half).
#
# Install (one-time, per clone):
#   pipx install pre-commit          # or: uvx pre-commit / uv tool install pre-commit
#   pre-commit install               # wire the commit-stage hooks
#   pre-commit install -t pre-push   # wire the pre-push gate
#
# One-off sweep over the whole tree:
#   pre-commit run --all-files
#
# Emergency bypass only (treat as debt to repay): git commit --no-verify
#
# Layering (see .claude/skills/dev-guardrails/references/git-hooks.md):
#   pre-commit = FAST: hygiene + ruff (worker/) + gitleaks + cargo fmt --check (brain/)
#   pre-push   = fast local gate: make lint + make typecheck + make test-fast
#                + cargo fmt --check (brain/)
#
# The pre-push hooks call `make` targets rather than re-spelling their commands.
# The Makefile is the source of truth, CI runs the same targets, so
# hook == make == CI by construction. Re-spelled commands drift silently, and
# they already had: both inlined pre-push commands were BROKEN and nobody knew,
# because this config was written but never installed anywhere.
#   * `uvx ruff check worker/` floated to the LATEST ruff and ran from the repo
#     root, reporting 33 errors that `make lint` (`uvx ruff@0.8.4 check .` from
#     worker/) does not. An unpinned linter in a blocking gate means an upstream
#     release turns every push red for reasons CI never sees.
#   * `uv run pytest -m "not infra"` omitted the `uv sync --extra dev` that
#     installs pytest, so it died with "Failed to spawn: pytest".
#
# Secret scanning stays on the COMMIT stage, not pre-push: it is fast, and
# catching a credential before it enters a commit beats catching it before it
# leaves the machine. CI's `security` job is the authoritative scan (full
# history + working tree).
#
# NOTE on cargo: this repo has no guaranteed local Rust toolchain — tests run in
# throwaway containers (see Makefile), so cargo may only exist inside the brain
# container. The cargo fmt hooks below are `language: system` and assume `cargo`
# is on your PATH. If it is not installed locally the hook will fail on your
# machine; CI (Track A) is the authoritative Rust gate. If you have no local
# toolchain, skip it with:  SKIP=cargo-fmt-check git commit ...
# =====================================================================
minimum_pre_commit_version: "3.5.0"

repos:
  # --- generic hygiene (commit stage) ---------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # --- Python: ruff lint + format, scoped to worker/ (commit stage) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff            # lint (autofix) worker/
        args: [--fix]
        files: ^worker/
      - id: ruff-format     # format worker/
        files: ^worker/

  # --- secret scanning: card #166 (pre-commit half) -------------------
  # Official gitleaks pre-commit hook with default rules (no config file needed).
  # The CI half of #166 is owned by another agent (Track A).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks        # block committed secrets

  # --- Rust format check, scoped to brain/ (commit stage) -------------
  # local `system` hook — see the "NOTE on cargo" block above re: availability.
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check (brain/)
        entry: cargo fmt --check --manifest-path brain/Cargo.toml
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

  # --- pre-push fast gate --------------------------------------------
  # Runs on `git push`, not every commit. Non-mutating checks only, and every
  # one delegates to the Makefile so it cannot drift from `make` or CI (see the
  # header). Bypass the whole stage with `git push --no-verify`, or one hook
  # with e.g. `SKIP=cargo-fmt-check-push git push`.
  #
  # Deliberately NOT here: the `infra`-marked worker tests and the brain suite.
  # Both need Postgres, the fixture warehouse and the Docker socket, which makes
  # them a `make test` / CI concern rather than a push gate.
  - repo: local
    hooks:
      - id: lint-push
        name: make lint — ruff@0.8.4 (worker/) [pre-push]
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: typecheck-push
        name: make typecheck — mypy, BLOCKING (worker/) [pre-push]
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test-fast-push
        name: make test-fast — pytest -m "not infra" (worker/) [pre-push]
        entry: make test-fast
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-fmt-check-push
        name: cargo fmt --check (brain/) [pre-push]
        entry: cargo fmt --check --manifest-path brain/Cargo.toml
        language: system
        pass_filenames: false
        stages: [pre-push]
